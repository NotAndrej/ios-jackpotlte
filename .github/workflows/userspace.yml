name: userspace

# Builds the phone's userspace in CI, because it is arm64 iOS (the iPhoneOS
# SDK) and this project keeps no Mac.  That is jackpotlte-maliprobe and, now,
# libjackpotlte - the M4 shim: the request layer a Linux-shaped GPU userspace
# (Mesa's panfrost) or the Metal plug-in draws through.
#
# Two checks are the point.  The M4 layer's ABI is compared against the kernel's
# own declarations (tools/jackpotlte/check-mali-abi.py compiles static asserts
# out of xnu/patches/0154), and the request layer's behaviour is checked against
# a fake IOKit under the sanitizers.  A structure that drifts, or a request that
# stops carrying the right fields, goes red here instead of on the phone (see
# JACKPOTLTE_PROGRESS.md, "green is not a patch that applied").

on:
  workflow_dispatch:
  push:
    branches: [main, s8-dreamlte]
    paths:
      - "userspace/**"
      # The ABI check reads these, so a change to them has to run it.
      - "xnu/patches/015*.patch"
      - "tools/jackpotlte/check-mali-abi.py"
      - ".github/workflows/userspace.yml"

concurrency:
  group: userspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build (host copies, arm64 iOS probe, arm64 iOS libjackpotlte.a)
        run: userspace/build.sh

      - name: The M4 ABI is the kernel's ABI
        run: python3 tools/jackpotlte/check-mali-abi.py

      - name: The request layer asks the kernel for the right things
        run: userspace/out/test_gpu_host

      - name: The phone's copies are arm64
        run: |
          file userspace/out/maliprobe
          lipo -info userspace/out/maliprobe | grep -q arm64
          lipo -info userspace/out/libjackpotlte.a | grep -q arm64

      - name: The ABI agrees with the kernel patch
        run: |
          set -e
          userspace/out/maliprobe.host --abi | tee abi.txt
          # The requests 0154 answers.  No trailing space in a pattern: the
          # last field of a line has none (BSD grep takes it literally, which
          # is what made the first version of this step fail).
          grep -q 'drm_gem_close=0x9'             abi.txt
          grep -q 'panfrost_submit=0x40'          abi.txt
          grep -q 'wait_bo=0x41'                  abi.txt
          grep -q 'create_bo=0x42'                abi.txt
          grep -q 'mmap_bo=0x43'                  abi.txt
          grep -q 'get_param=0x44'                abi.txt
          grep -q 'get_bo_offset=0x45'            abi.txt
          grep -q 'madvise=0x48'                  abi.txt
          grep -q 'wait=0x7d'                     abi.txt
          grep -q 'surface=0x7e'                  abi.txt
          grep -q 'describe=0xffffffff'           abi.txt
          # The structures the kernel memcpy()s in and out.
          grep -q 'sizeof(drm_gem_close)=8'                 abi.txt
          grep -q 'sizeof(drm_panfrost_submit)=40'          abi.txt
          grep -q 'sizeof(drm_panfrost_wait_bo)=16'         abi.txt
          grep -q 'sizeof(drm_panfrost_create_bo)=24 offsetof(offset)=16' abi.txt
          grep -q 'sizeof(drm_panfrost_mmap_bo)=16'         abi.txt
          grep -q 'sizeof(drm_panfrost_get_param)=16'       abi.txt
          grep -q 'sizeof(drm_panfrost_get_bo_offset)=16'   abi.txt
          grep -q 'sizeof(drm_panfrost_madvise)=12'         abi.txt
          grep -q 'sizeof(jackpotlte_surface)=40 offsetof(handle)=4 offsetof(size)=8' abi.txt
          grep -q 'sizeof(jackpotlte_wait)=16'              abi.txt

      - name: The host copy runs
        run: userspace/out/maliprobe.host --help

      # The arm64 copies are the artifacts that go onto the phone:
      # /usr/local/bin/maliprobe, and libjackpotlte.a with its header for the
      # next userspace layer to link against.  This project keeps no Mac, so a
      # run's artifact is how they get off the runner.
      - uses: actions/upload-artifact@v4
        with:
          name: userspace
          path: userspace/out/
