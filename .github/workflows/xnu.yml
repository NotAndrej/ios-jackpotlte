name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: A5XELTE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      extra_cflags:
        description: Extra MACHINE_FLAGS (e.g. -DJACKPOTLTE=1 for the A8 donor build)
        default: ""
  push:
    branches: [main, s8-dreamlte]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'A5XELTE' }}
  # The A8 port is MACHINE_CONFIG=A5XELTE plus -DJACKPOTLTE=1 (see
  # pexpert/pexpert/arm64/A5XELTE.h in patch 0124: without JACKPOTLTE the
  # header defines DREAMLTE and every jackpotlte-gated path becomes dead code
  # while the S8 paths run). Push builds must set it explicitly; only a
  # manual dispatch for the S8 board may clear it.
  EXTRA_MACHINE_FLAGS: ${{ inputs.extra_cflags || '-DJACKPOTLTE=1' }}

jobs:
  build:
    # macos-15 ships Xcode 16+, whose iig emits IORPC.kernelContent. Patch
    # 0083-xcode27-iig-kernel-content.patch adds that field to xnu-8796, so the
    # modern SDK builds this kernel. (macos-14 was rejected by the runner.)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          if [ "$MACHINE_CONFIG" = A5XELTE ]; then
            # Cortex-A53 (Exynos7580 / Exynos8895) is ARMv8.0: Xcode's default
            # arm64 code generation emits LSE atomics (ldadd/cas) that trap as
            # "Undefined kernel instruction" right after "Firehose configured"
            # (S8 boot 2). Same flags as tools/a5xelte-build-firehose.sh.
            sed -i '' "s/ARCHS=\"x86_64 arm64e\" VALID_ARCHS=\"x86_64 arm64e\"/ARCHS=arm64 VALID_ARCHS=arm64 OTHER_CFLAGS='-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53 -march=armv8-a+crypto'/" dxb/build.sh
            grep -c "VALID_ARCHS=arm64 OTHER_CFLAGS='-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53" dxb/build.sh
          else
            sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
            grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          fi
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          # macos-15 ships Xcode 16+/26; patch 0083 adds the IORPC.kernelContent
          # field those iig versions emit, so the newest Xcode is fine. Sort by
          # version and take the highest.
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selected Xcode: $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Install KDK with retries
        env:
          MANIFEST: https://raw.githubusercontent.com/dortania/KdkSupportPkg/gh-pages/manifest.json
        run: |
          set -euo pipefail
          # build.sh otherwise downloads the 13.5 KDK itself with a single
          # `curl -L` and no sanity check. The dortania release CDN
          # intermittently answers with an HTTP 5xx and a ~92-byte HTML body;
          # curl then writes that error page to /tmp/KDK.dmg and
          # `hdiutil attach` fails with "image not recognized" (runs
          # 42465218978 / 42465363837). Download here with retries and a real
          # disk-image check, trying the 13.5, 13.5.1 and 13.5.2 KDK builds in
          # turn, then hand the installed path to build.sh via KDKROOT so it
          # skips its own download entirely.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 60 --max-time 120 \
            -o /tmp/kdk-manifest.json "$MANIFEST"
          names=(
            "Kernel Debug Kit 13.5 build 22G74"
            "Kernel Debug Kit 13.5.1 build 22G90"
            "Kernel Debug Kit 13.5.2 build 22G91"
          )
          min_bytes=$((100 * 1024 * 1024))
          ok=0
          for name in "${names[@]}"; do
            url=$(jq -r --arg n "$name" '.[] | select(.name==$n) | .url' /tmp/kdk-manifest.json)
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "::warning::manifest has no entry for '$name'"
              continue
            fi
            echo "⇒ KDK candidate: $name"
            echo "  $url"
            attempt=0
            while [ "$attempt" -lt 5 ]; do
              attempt=$((attempt + 1))
              rm -f /tmp/KDK.dmg
              if curl --fail --location --progress-bar \
                   --retry 3 --retry-all-errors --retry-delay 10 \
                   --connect-timeout 60 --max-time 1800 \
                   -o /tmp/KDK.dmg "$url"; then
                size=$(stat -f %z /tmp/KDK.dmg)
                if [ "$size" -gt "$min_bytes" ] && hdiutil imageinfo /tmp/KDK.dmg >/dev/null 2>&1; then
                  echo "  OK: /tmp/KDK.dmg is a disk image ($size bytes)"
                  ok=1
                  break 2
                fi
                echo "::warning::$name attempt $attempt: download is not a valid disk image (size=$size)"
              else
                echo "::warning::$name attempt $attempt: download failed"
              fi
              sleep 15
            done
          done
          if [ "$ok" != 1 ]; then
            echo "::error::could not download a valid 13.5 KDK (22G74/22G90/22G91) from the dortania manifest"
            exit 1
          fi
          echo "⇒ Installing KDK"
          hdiutil attach /tmp/KDK.dmg
          if [ ! -d " /Library/Developer/KDKs" ]; then
            sudo mkdir -p /Library/Developer/KDKs
            sudo chmod 755 /Library/Developer/KDKs
          fi
          sudo installer -pkg '/Volumes/Kernel Debug Kit/KernelDebugKit.pkg' -target /
          hdiutil detach '/Volumes/Kernel Debug Kit' || true
          ls -lah /Library/Developer/KDKs
          kdkroot=$(ls -d /Library/Developer/KDKs/KDK_13.5*.kdk 2>/dev/null | sort -V | tail -1 || true)
          if [ ! -d "$kdkroot" ]; then
            echo "::error::no 13.5 KDK was installed"
            exit 1
          fi
          echo "KDKROOT=$kdkroot" >> "$GITHUB_ENV"
          echo "Installed KDK: $kdkroot"

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
          # appended to MACHINE_FLAGS_ARM64_<config> by patch 0085; the job-level
          # env supplies -DJACKPOTLTE=1 when no dispatch input was given
          EXTRA_MACHINE_FLAGS: ${{ env.EXTRA_MACHINE_FLAGS }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Require every project patch to apply
        if: always()
        run: |
          # blacktop's own patches may legitimately be "already upstream"; ours
          # may not.  A silently skipped patch once shipped a kernel without the
          # Mali driver while the run stayed green (run 42640666505), so fail
          # loudly if any patch under xnu/patches/ was skipped.
          log=dxb/build.log
          if [ ! -f "$log" ]; then
            echo "::error::no build log at $log"
            exit 1
          fi
          grep -E 'Skipping patch' "$log" | grep -oE '[^ /]+\.patch' | sort -u > skipped.txt || true
          bad=0
          for f in xnu/patches/*.patch; do
            b=$(basename "$f")
            if grep -qx "$b" skipped.txt; then
              echo "::error::required patch was skipped: $b"
              bad=1
            fi
          done
          if [ "$bad" != 0 ]; then
            echo "--- skipped patches seen ---"
            cat skipped.txt
            exit 1
          fi
          echo "all $(ls xnu/patches/*.patch | wc -l | tr -d ' ') project patches applied"

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          shopt -s nullglob
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -f "$lib" ] || continue
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Fail on a stub kernel
        if: always()
        run: |
          # A real xnu-8796 kernel is tens of megabytes. A tiny file means the
          # build silently produced nothing; fail loudly instead of uploading it.
          min=$((4 * 1024 * 1024))
          found=0
          for k in out/kernel.*; do
            case "$k" in *.link|*.dSYM|*SHA256SUMS) continue ;; esac
            [ -f "$k" ] || continue
            found=1
            size=$(stat -f %z "$k")
            echo "$k: $size bytes"
            if [ "$size" -lt "$min" ]; then
              echo "::error::$k is $size bytes, below the $min-byte kernel minimum (stub?)"
              exit 1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::no kernel.* artifact produced"
            exit 1
          fi

      - name: Check for ARMv8.1 LSE instructions (Cortex-A53 has none)
        if: always()
        run: |
          for k in out/kernel.*; do
            [ -f "$k" ] || continue
            case "$k" in *.link|*.dSYM) continue ;; esac
            xcrun llvm-objdump -d --no-show-raw-insn "$k" > "$k.disasm" 2>/dev/null || continue
            # function headers + LSE mnemonics, so each hit names its function
            grep -E '^[0-9a-f]+ <|	(cas|casa|casal|casl|casp|ldadd|ldclr|ldeor|ldset|ldsmax|ldsmin|ldumax|ldumin|stadd|stclr|steor|stset|stsmax|stsmin|stumax|stumin|swp)[a-z]*	' "$k.disasm" \
              | awk '/^[0-9a-f]+ </{fn=$2; next} {n++; c[fn]++} END {printf "LSE instructions: %d\n", n+0; for (f in c) print c[f], f}' \
              | sort -rn | head -40 | tee "$k.lse.txt"
            rm -f "$k.disasm"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
